<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Bus Navigator</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><h1>🚌 Smart Bus Navigator</h1></header>
<main>{% for id, r in routes.items() %}
<div class="card"><h3>{{ r.name }}</h3>
<a class="btn" href="/bus/{{ id }}">Passenger view</a>
<a class="btn alt" href="/driver/{{ id }}">Driver mode</a>
<a class="btn alt" href="/ticket/{{ id }}">Ticket back</a></div>{% endfor %}</main></body></html>
